<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="月讀">
<meta name="theme-color" content="#1f2a36">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>月讀</title>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(function () {});</script>
<style>
:root{--bg:#f6f5f1;--fg:#1d1d1f;--sub:#76767b;--card:#fff;--line:#e2e1dc;--acc:#2f6fb3;--bar:rgba(250,249,246,.97);--rbg:#fbfaf6;--rfg:#222;
  --st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom);--sl:env(safe-area-inset-left);--sr:env(safe-area-inset-right);
  --fs:19px;--lh:1.8;--ps:.5em;--ind:2em;--ff:-apple-system,"PingFang TC",sans-serif;--mg:22px;--ta:justify}
[data-theme=dark]{--bg:#161618;--fg:#e4e4e6;--sub:#8e8e93;--card:#242426;--line:#363638;--acc:#6aa8ff;--bar:rgba(30,30,32,.97)}
[data-rt=light]{--rbg:#fbfaf6;--rfg:#222}
[data-rt=sepia]{--rbg:#f3e9d2;--rfg:#43351f}
[data-rt=green]{--rbg:#d9ead3;--rfg:#203820}
[data-rt=paper]{--rbg:#ece7dc;--rfg:#33302a}
[data-rt=gray]{--rbg:#3a3b3d;--rfg:#cfcfcf}
[data-rt=dark]{--rbg:#1b1c1e;--rfg:#a9a9a9}
[data-rt=black]{--rbg:#000;--rfg:#9a9a9a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,"PingFang TC",sans-serif;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit}
.hidden{display:none!important}
.btn{padding:8px 13px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:15px;white-space:nowrap}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.warn{color:#d33}
.ico{width:38px;height:38px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.ico svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* ---------- library ---------- */
#lib{position:fixed;inset:0;display:flex;flex-direction:column}
#lhead{padding:calc(var(--st) + 6px) calc(var(--sr) + 10px) 0 calc(var(--sl) + 10px);background:var(--bg);border-bottom:1px solid var(--line)}
.lrow{display:flex;align-items:center;gap:2px}
#ltitle{flex:1;font-size:24px;font-weight:700;margin:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lback{font-size:17px;color:var(--acc);padding:6px 4px;flex:none}
#tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:6px 0 0}
#tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 12px 10px;font-size:15px;color:var(--sub);border-bottom:2.5px solid transparent;white-space:nowrap}
.tab.on{color:var(--fg);font-weight:600;border-color:var(--acc)}
#lsearch{padding:8px 0}
#lsearch input{width:100%;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:16px}
#lbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px calc(var(--sr) + 14px) calc(var(--sb) + 90px) calc(var(--sl) + 14px)}
.sec{font-size:13px;color:var(--sub);font-weight:600;margin:16px 2px 8px;letter-spacing:.5px}
.sec:first-child{margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:18px 12px}
.bk{display:flex;flex-direction:column;gap:5px;text-align:left;position:relative;min-width:0;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.cv{aspect-ratio:2/3;border-radius:5px;overflow:hidden;position:relative;box-shadow:0 1px 2px rgba(0,0,0,.15),0 3px 10px rgba(0,0,0,.14);background:#888}
.cv img{width:100%;height:100%;object-fit:cover;display:block;-webkit-touch-callout:none}
.cv .ph{position:absolute;inset:0;padding:12% 10% 12% 14%;color:#fff;display:flex;flex-direction:column;justify-content:space-between;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.cv .ph b{font-size:14px;line-height:1.35;word-break:break-all;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.cv .ph i{font-style:normal;font-size:10px;opacity:.85}
.cv .ph:before{content:"";position:absolute;left:7%;top:0;bottom:0;width:2px;background:rgba(255,255,255,.25)}
.cv .fmt{position:absolute;right:4px;top:4px;font-size:9px;background:rgba(0,0,0,.5);color:#fff;padding:1px 4px;border-radius:3px}
.cv .pb{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.25)}
.cv .pb i{display:block;height:100%;background:var(--acc)}
.cv .done{position:absolute;right:4px;bottom:8px;font-size:10px;background:#2e9e57;color:#fff;padding:1px 5px;border-radius:3px}
.cv .fav{position:absolute;left:4px;top:3px;font-size:13px;color:#ffcc33;text-shadow:0 0 3px rgba(0,0,0,.6)}
.bk .bt{font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bk .bs{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk.sel .cv{outline:3px solid var(--acc);outline-offset:2px}
.bk .ck{position:absolute;right:-4px;top:-4px;width:22px;height:22px;border-radius:50%;background:var(--card);border:1.5px solid var(--line);z-index:2;font-size:13px;display:flex;align-items:center;justify-content:center}
.bk.sel .ck{background:var(--acc);border-color:var(--acc);color:#fff}
.list .bk{flex-direction:row;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.list .cv{width:52px;flex:none}
.list .cv .ph b{font-size:9px}
.list .cv .ph i,.list .cv .fmt{display:none}
.list .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.list .bt{font-size:15px;-webkit-line-clamp:1}
.list .bs{font-size:12px}
.list .lp{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:2px}
.list .lp i{display:block;height:100%;background:var(--acc)}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.grp{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;min-width:0}
.grp .col{display:grid;grid-template-columns:1fr 1fr;gap:4px;aspect-ratio:1.1;margin-bottom:8px}
.grp .col>div{border-radius:3px;overflow:hidden;background:var(--line)}
.grp .col img{width:100%;height:100%;object-fit:cover;display:block}
.grp b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp span{font-size:12px;color:var(--sub)}
.empty{color:var(--sub);text-align:center;padding:50px 10px;line-height:1.9}
.notice{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:13px;line-height:1.6}
#selbarL{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bar);border-top:1px solid var(--line);padding:10px calc(var(--sr) + 12px) calc(var(--sb) + 10px) calc(var(--sl) + 12px);display:flex;gap:8px;align-items:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#selbarL .n{flex:1;font-size:14px;color:var(--sub)}
#fab{position:fixed;right:calc(var(--sr) + 18px);bottom:calc(var(--sb) + 20px);width:56px;height:56px;border-radius:50%;background:var(--acc);color:#fff;font-size:30px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:5}
/* ---------- reader ---------- */
#rd{position:fixed;inset:0;background:var(--rbg);color:var(--rfg);overflow:hidden}
#page{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--st) + 30px) calc(var(--sr) + var(--mg)) calc(var(--sb) + 34px) calc(var(--sl) + var(--mg))}
#content{font-family:var(--ff);font-size:var(--fs);line-height:var(--lh);text-align:var(--ta);word-break:break-word;max-width:760px;margin:0 auto;-webkit-user-select:text;user-select:text}
#content img,#content svg{max-width:100%;height:auto}
#content p,#content .p{margin:0 0 var(--ps);text-indent:var(--ind)}
#content p.blank{height:.4em;margin:0;text-indent:0}
#content h1,#content h2,#content h3,#content h4{line-height:1.4;text-indent:0;text-align:center;font-weight:600}
#content h1{font-size:1.4em}#content h2{font-size:1.25em}#content h3{font-size:1.1em}
#content [role=link]{color:var(--acc);text-decoration:underline}
#content mark{background:var(--hc,rgba(255,214,0,.4));color:inherit;border-radius:2px}
#content mark.ul{background:none;text-decoration:underline 2px var(--hcs,#e5a000);text-underline-offset:3px}
#content mark.st{background:none;text-decoration:line-through 2px var(--hcs,#d33)}
#content mark.hasnote{border-bottom:2px dotted var(--acc)}
#content mark.flash{background:rgba(255,140,0,.5)}
::highlight(tts){background-color:rgba(80,160,255,.35)}
.chend{display:flex;justify-content:space-between;gap:10px;margin:30px auto 10px;max-width:760px}
.chend .btn{flex:1;text-align:center;background:transparent;border-color:currentColor;color:inherit;opacity:.6}
#rd.paged #page{overflow:hidden}
#rd.paged #content{height:var(--ph);width:var(--pw);max-width:none;margin:0;column-width:var(--pw);column-gap:var(--gap);column-fill:auto;will-change:transform}
#rd.paged #content.anim{transition:transform .26s cubic-bezier(.25,.8,.3,1)}
#rd.paged #content img{max-height:calc(var(--ph) - 1.5em);object-fit:contain;break-inside:avoid;display:block;margin:0 auto}
#rd.paged .chend{display:none}
#hdr{position:absolute;top:0;left:0;right:0;padding:calc(var(--st) + 6px) calc(var(--sr) + var(--mg)) 0 calc(var(--sl) + var(--mg));font-size:11px;opacity:.55;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--rbg);height:calc(var(--st) + 26px)}
#ftr{position:absolute;bottom:0;right:0;left:0;padding:0 calc(var(--sr) + var(--mg)) calc(var(--sb) + 8px) calc(var(--sl) + var(--mg));font-size:11px;opacity:.55;pointer-events:none;display:flex;justify-content:space-between;background:var(--rbg);height:calc(var(--sb) + 28px);align-items:flex-end;font-variant-numeric:tabular-nums}
#rd.scroll #hdr{background:linear-gradient(var(--rbg) 75%,transparent)}
#rd.scroll #ftr{background:linear-gradient(transparent,var(--rbg) 40%)}
#dim{position:absolute;inset:0;background:#000;pointer-events:none;opacity:0;z-index:4}
#bubble{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:rgba(0,0,0,.72);color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;z-index:9;pointer-events:none}
.bar{position:absolute;left:0;right:0;background:var(--bar);color:var(--fg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:var(--line);z-index:6;transition:transform .2s ease}
#tbar{top:0;padding:calc(var(--st) + 4px) calc(var(--sr) + 6px) 4px calc(var(--sl) + 6px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:2px}
#tbar.off{transform:translateY(-110%)}
#bbar{bottom:0;padding:8px calc(var(--sr) + 10px) calc(var(--sb) + 6px) calc(var(--sl) + 10px);border-top:1px solid var(--line)}
#bbar.off{transform:translateY(110%)}
.tt{flex:1;font-size:15px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.prow{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub)}
.prow input{flex:1;accent-color:var(--acc);min-width:0}
.brow{display:flex;justify-content:space-around;margin-top:6px}
.brow button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:4px 6px;color:var(--fg)}
.brow svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#selbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 16px);background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:24px;padding:6px 8px;display:flex;gap:7px;z-index:8;box-shadow:0 4px 18px rgba(0,0,0,.22);align-items:center}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);flex:none}
#guide{position:absolute;inset:0;z-index:20;display:grid;grid-template-columns:30% 40% 30%;color:#fff;font-size:16px;text-align:center}
#guide div{display:flex;align-items:center;justify-content:center;background:rgba(47,111,179,.6);border:1px dashed rgba(255,255,255,.6);padding:10px;line-height:1.7}
#guide div:nth-child(2){background:rgba(46,158,87,.6)}
#ctl{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 16px);background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:24px;padding:6px 10px;display:flex;gap:6px;z-index:7;box-shadow:0 4px 18px rgba(0,0,0,.22);align-items:center;font-size:14px;white-space:nowrap}
#ctl button{padding:6px 10px;border-radius:14px;background:var(--bg)}
/* ---------- panels ---------- */
.panel{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.35);display:flex;align-items:flex-end}
.sheet{background:var(--bg);color:var(--fg);width:100%;max-height:86%;border-radius:16px 16px 0 0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px calc(var(--sr) + 16px) calc(var(--sb) + 20px) calc(var(--sl) + 16px)}
.sheet:before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet h3{margin:2px 0 10px;font-size:17px;display:flex;align-items:center;gap:8px}
.sheet h3 span{flex:1}
.li{display:block;width:100%;text-align:left;padding:11px 4px;border-bottom:1px solid var(--line);font-size:15px;line-height:1.5}
.li .q{border-left:4px solid var(--c,#fd0);padding-left:8px}
.li .n{color:var(--sub);font-size:13px;margin-top:4px;padding-left:12px}
.li .m{color:var(--sub);font-size:11px;padding-left:12px}
.li.cur{color:var(--acc);font-weight:600}
.li em{font-style:normal;background:rgba(255,200,0,.45)}
.set{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);gap:8px;font-size:15px}
.set>span{flex:none}
.seg{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.seg button{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:14px}
.seg button.on{border-color:var(--acc);color:var(--acc);font-weight:600}
.seg button.sw{width:30px;height:30px;border-radius:50%;padding:0}
.seg button.sw.on{box-shadow:0 0 0 2px var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{padding:6px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:14px}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.binfo{display:flex;gap:14px;margin-bottom:14px}
.binfo .cv{width:96px;flex:none}
.binfo .meta{font-size:13px;color:var(--sub);line-height:1.75;min-width:0}
.binfo .meta b{display:block;font-size:17px;color:var(--fg);line-height:1.35;margin-bottom:4px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.acts button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:12px}
.acts button i{font-style:normal;font-size:20px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 14px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--sub)}
#modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:20px}
.mbox{background:var(--bg);color:var(--fg);border-radius:14px;max-width:440px;width:100%;max-height:85%;overflow-y:auto;padding:18px}
.mbox h3{margin:0 0 8px}
.mbox .body{font-size:14px;line-height:1.65}
.mbox textarea,.mbox input[type=text]{width:100%;font-size:16px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.mbox .mact{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.mbox pre{white-space:pre-wrap;font-size:11px;background:var(--card);padding:8px;border-radius:6px;max-height:200px;overflow:auto}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 90px);background:rgba(0,0,0,.82);color:#fff;padding:8px 14px;border-radius:18px;font-size:14px;z-index:70;pointer-events:none;max-width:86%;text-align:center}
#busy{position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;text-align:center;padding:20px;white-space:pre-line}
.pdfp{margin:0 auto 10px;background:#fff;position:relative;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.pdfp canvas{width:100%;height:100%;display:block}
.pdfp .pn{position:absolute;right:4px;bottom:2px;font-size:10px;color:#999}
#lock{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:center}
.lk{text-align:center;width:280px}
.lk .t{font-size:17px;margin-bottom:18px}
#lkDots{display:flex;gap:16px;justify-content:center;margin-bottom:28px}
#lkDots span{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--fg)}
#lkDots span.f{background:var(--fg)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 22px}
.pad button{height:68px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:26px}
.pad button.tx{background:none;border:0;font-size:14px;color:var(--sub)}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
#xfer .code{font-size:38px;letter-spacing:6px;font-weight:700;text-align:center;margin:6px 0 2px;font-variant-numeric:tabular-nums}
#xfer .url{font-size:17px;text-align:center;font-weight:600;word-break:break-all;margin:4px 0 12px;color:var(--acc)}
#xfer .st{font-size:14px;color:var(--sub);text-align:center;margin-bottom:10px}
#xfer .rx{font-size:13px;line-height:1.7;max-height:260px;overflow:auto}
</style>
</head>
<body>
<div id="lib">
  <div id="lhead">
    <div class="lrow">
      <button id="lback" class="hidden">‹ 返回</button>
      <h1 id="ltitle">書架</h1>
      <button class="ico" id="bSearchL" title="搜尋"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
      <button class="ico" id="bSort" title="排序與檢視"><svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg></button>
      <button class="ico" id="bSelect" title="選取"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12l2.5 2.5 5-5"/></svg></button>
      <button class="ico" id="bMenu" title="更多"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg></button>
    </div>
    <div id="lsearch" class="hidden"><input id="search" type="search" placeholder="搜尋書名、作者"></div>
    <div id="tabs"></div>
  </div>
  <div id="lbody"></div>
  <button id="fab" title="匯入">＋</button>
  <div id="selbarL" class="hidden"><span class="n" id="selN"></span><button class="btn" data-a="fav">收藏</button><button class="btn" data-a="tag">書架</button><button class="btn warn" data-a="del">刪除</button><button class="btn pri" data-a="done">完成</button></div>
</div>

<div id="rd" class="hidden">
  <div id="page"><div id="content"></div><div id="chend" class="chend"></div></div>
  <div id="hdr"></div>
  <div id="ftr"><span id="fClock"></span><span id="fPos"></span></div>
  <div id="dim"></div>
