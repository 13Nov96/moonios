<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="月讀">
<meta name="theme-color" content="#1f2a36">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>月讀</title>
<style>
:root{--bg:#fafaf7;--fg:#1d1d1f;--sub:#6e6e73;--card:#fff;--line:#e3e3e0;--acc:#2f6fb3;--bar:rgba(250,250,247,.96);
  --st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom);--sl:env(safe-area-inset-left);--sr:env(safe-area-inset-right);
  --fs:19px;--lh:1.8;--ff:-apple-system,"PingFang TC","Heiti TC",sans-serif;--mg:20px}
[data-theme=sepia]{--bg:#f4ecd8;--fg:#3b2f1e;--sub:#7a6a52;--card:#fbf5e6;--line:#e0d4b8;--bar:rgba(244,236,216,.96)}
[data-theme=dark]{--bg:#1c1c1e;--fg:#d8d8d8;--sub:#8e8e93;--card:#2c2c2e;--line:#3a3a3c;--acc:#6aa8ff;--bar:rgba(28,28,30,.96)}
[data-theme=black]{--bg:#000;--fg:#b8b8b8;--sub:#777;--card:#141414;--line:#2a2a2a;--acc:#6aa8ff;--bar:rgba(0,0,0,.96)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,"PingFang TC",sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.hidden{display:none!important}
/* library */
#lib{height:100%;overflow-y:auto;padding:calc(var(--st) + 8px) calc(var(--sr) + 14px) calc(var(--sb) + 20px) calc(var(--sl) + 14px)}
.top{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
.top h1{font-size:26px;margin:0;flex:1}
.btn{padding:8px 13px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:15px}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
#shelves{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
#shelves::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:6px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:14px}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
#search{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:16px;margin-bottom:10px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:16px 12px}
.bk{display:flex;flex-direction:column;gap:5px;text-align:left}
.cv{aspect-ratio:2/3;border-radius:6px;overflow:hidden;background:#8a9bb0;position:relative;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.cv .ph{position:absolute;inset:0;padding:10px 8px;color:#fff;font-size:14px;line-height:1.35;font-weight:600;word-break:break-all;overflow:hidden}
.cv .fmt{position:absolute;right:4px;bottom:4px;font-size:10px;background:rgba(0,0,0,.55);color:#fff;padding:1px 5px;border-radius:4px}
.cv .pb{position:absolute;left:0;bottom:0;height:3px;background:var(--acc)}
.bt{font-size:13px;line-height:1.3;max-height:2.6em;overflow:hidden}
.bs{font-size:11px;color:var(--sub)}
.empty{color:var(--sub);text-align:center;padding:50px 10px;line-height:1.8}
.notice{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px;line-height:1.6}
/* reader */
#rd{position:fixed;inset:0;background:var(--bg)}
#page{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--st) + 26px) calc(var(--sr) + var(--mg)) calc(var(--sb) + 40px) calc(var(--sl) + var(--mg))}
#content{font-family:var(--ff);font-size:var(--fs);line-height:var(--lh);text-align:justify;word-break:break-word;max-width:760px;margin:0 auto}
#content img,#content svg{max-width:100%;height:auto}
#content p{margin:0 0 .6em}
#content p.blank{height:.5em;margin:0}
#content h1,#content h2,#content h3{line-height:1.4}
#content a{color:var(--acc)}
#content mark{background:var(--hc,rgba(255,214,0,.4));color:inherit;border-radius:2px}
#content mark.ul{background:none;text-decoration:underline 2px var(--hcs,#e5a000);text-underline-offset:3px}
#content mark.st{background:none;text-decoration:line-through 2px var(--hcs,#d33)}
#content mark.hasnote{border-bottom:2px dotted var(--acc)}
.chend{display:flex;justify-content:space-between;gap:10px;margin:30px auto 10px;max-width:760px}
.chend .btn{flex:1;text-align:center}
#hdr{position:fixed;top:0;left:0;right:0;padding:calc(var(--st) + 4px) 14px 0;font-size:11px;color:var(--sub);pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;background:linear-gradient(var(--bg) 70%,transparent);height:calc(var(--st) + 22px)}
#ftr{position:fixed;bottom:0;right:0;left:0;padding:0 14px calc(var(--sb) + 4px);font-size:11px;color:var(--sub);pointer-events:none;text-align:right}
.bar{position:fixed;left:0;right:0;background:var(--bar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-color:var(--line);z-index:5;display:flex;align-items:center;gap:4px}
#tbar{top:0;padding:calc(var(--st) + 6px) calc(var(--sr) + 8px) 8px calc(var(--sl) + 8px);border-bottom:1px solid var(--line)}
#bbar{bottom:0;padding:8px calc(var(--sr) + 8px) calc(var(--sb) + 8px) calc(var(--sl) + 8px);border-top:1px solid var(--line);flex-direction:column;align-items:stretch}
.ib{padding:8px 10px;font-size:15px;border-radius:8px}
.tt{flex:1;font-size:14px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center;gap:8px;justify-content:space-around}
#slider{width:100%;accent-color:var(--acc)}
#selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 14px);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:6px 8px;display:flex;gap:6px;z-index:8;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line)}
/* panels & modal */
.panel{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.35);display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-height:82%;border-radius:16px 16px 0 0;overflow-y:auto;padding:14px calc(var(--sr) + 16px) calc(var(--sb) + 20px) calc(var(--sl) + 16px)}
.sheet h3{margin:4px 0 10px;font-size:17px}
.li{display:block;width:100%;text-align:left;padding:11px 4px;border-bottom:1px solid var(--line);font-size:15px;line-height:1.5}
.li .q{border-left:4px solid var(--c,#fd0);padding-left:8px}
.li .n{color:var(--sub);font-size:13px;margin-top:4px;padding-left:12px}
.li .m{color:var(--sub);font-size:11px;padding-left:12px}
.li.cur{color:var(--acc);font-weight:600}
.set{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);gap:8px}
.seg{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.seg button{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:14px}
.seg button.on{border-color:var(--acc);color:var(--acc)}
#modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:20px}
.mbox{background:var(--bg);border-radius:14px;max-width:440px;width:100%;max-height:85%;overflow-y:auto;padding:18px}
.mbox h3{margin:0 0 8px}
.mbox .body{font-size:14px;line-height:1.65}
.mbox textarea,.mbox input[type=text]{width:100%;font-size:16px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.mbox .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.mbox pre{white-space:pre-wrap;font-size:11px;background:var(--card);padding:8px;border-radius:6px;max-height:200px;overflow:auto}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 70px);background:rgba(0,0,0,.8);color:#fff;padding:8px 14px;border-radius:18px;font-size:14px;z-index:30;pointer-events:none}
#busy{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;text-align:center;padding:20px;white-space:pre-line}
.pdfp{margin:0 auto 10px;background:#fff;position:relative;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.pdfp canvas{width:100%;height:100%;display:block}
.pdfp .pn{position:absolute;right:4px;bottom:2px;font-size:10px;color:#999}

#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center}
.lk{text-align:center;width:280px}
.lk .t{font-size:17px;margin-bottom:18px}
#lkDots{display:flex;gap:16px;justify-content:center;margin-bottom:28px}
#lkDots span{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--fg)}
#lkDots span.f{background:var(--fg)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 22px}
.pad button{height:68px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:26px}
.pad button.tx{background:none;border:0;font-size:14px;color:var(--sub)}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
#xfer .code{font-size:38px;letter-spacing:6px;font-weight:700;text-align:center;margin:6px 0 2px;font-variant-numeric:tabular-nums}
#xfer .url{font-size:17px;text-align:center;font-weight:600;word-break:break-all;margin:4px 0 12px;color:var(--acc)}
#xfer .st{font-size:14px;color:var(--sub);text-align:center;margin-bottom:10px}
#xfer .rx{font-size:13px;line-height:1.7;max-height:260px;overflow:auto}
</style>
</head>
<body>
<div id="lib">
  <div class="top">
    <h1>月讀</h1>
    <button class="btn" id="bMenu">⋯</button>
    <button class="btn pri" id="bImport">匯入</button>
  </div>
  <div id="notice"></div>
  <input id="search" type="search" placeholder="搜尋書名／作者">
  <div id="shelves"></div>
  <div id="grid"></div>
</div>

<div id="rd" class="hidden">
  <div id="page"><div id="content"></div><div id="chend" class="chend"></div></div>
  <div id="hdr"></div>
  <div id="ftr"></div>
  <div id="tbar" class="bar hidden">
    <button class="ib" id="bBack">‹ 書架</button>
    <div class="tt" id="rTitle"></div>
    <button class="ib" id="bMark">🔖</button>
  </div>
  <div id="bbar" class="bar hidden">
    <input id="slider" type="range" min="0" max="1000" value="0">
    <div class="row">
      <button class="ib" id="bPrev">‹ 上一章</button>
      <button class="ib" id="bToc">目錄</button>
      <button class="ib" id="bNotes">筆記</button>
      <button class="ib" id="bSet">Aa</button>
      <button class="ib" id="bNext">下一章 ›</button>
    </div>
  </div>
  <div id="selbar" class="hidden"></div>
</div>

<div id="panel" class="panel hidden"><div class="sheet" id="sheet"></div></div>
<div id="xfer" class="panel hidden"><div class="sheet">
  <h3>WiFi 傳書</h3>
  <div class="bs" style="text-align:center">電腦與手機連同一個 WiFi，用電腦瀏覽器開：</div>
  <div class="url" id="xUrl"></div>
  <div class="bs" style="text-align:center">輸入配對碼</div>
  <div class="code" id="xCode">······</div>
  <div class="st" id="xSt">連線中…</div>
  <div class="rx" id="xRx"></div>
  <div style="display:flex;gap:8px;margin-top:12px"><button class="btn" id="xNew" style="flex:1">換配對碼</button><button class="btn pri" id="xClose" style="flex:1">完成</button></div>
  <div class="bs" style="margin-top:10px">傳輸時請保持這個畫面開著、不要鎖螢幕。</div>
</div></div>
<div id="lock" class="hidden"><div class="lk"><div class="t" id="lkT">輸入密碼</div><div id="lkDots"><span></span><span></span><span></span><span></span></div>
  <div class="pad" id="pad"><button>1</button><button>2</button><button>3</button><button>4</button><button>5</button><button>6</button><button>7</button><button>8</button><button>9</button><button class="tx" data-k="forgot">忘記</button><button>0</button><button class="tx" data-k="del">刪除</button></div></div></div>
<div id="modal" class="hidden"><div class="mbox" id="mbox"></div></div>
<div id="toast" class="hidden"></div>
<div id="busy" class="hidden"></div>
<input type="file" id="fileIn" multiple class="hidden">

<script src="vendor/jszip.min.js"></script>
<script src="vendor/sql-wasm.js"></script>
<script src="vendor/peerjs.min.js"></script>
<script src="app.js?v=2"></script>
</body>
</html>
